<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVA Release History</title>
  <style>
    body{margin:0;background:#0b1020;color:#edf2ff;font:15px/1.5 Inter,system-ui,sans-serif}
    main{width:min(900px,calc(100% - 32px));margin:0 auto;padding:40px 0}
    .card{background:#131b2e;border:1px solid #26324d;border-radius:16px;padding:22px;overflow-x:auto}
    h1{margin:0 0 8px;font-size:34px}.muted{color:#9eabc7}svg{min-width:700px;width:100%;height:auto}
    table{width:100%;border-collapse:collapse;margin-top:22px}th,td{padding:9px;border-bottom:1px solid #26324d;text-align:right}
    th:first-child,td:first-child{text-align:left}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  </style>
</head>
<body><main>
  <h1>Autodesk AVA Release History</h1>
  <p class="muted">Dated regression runs over the stable 30-test comparison set.</p>
  <section class="card">
    <div class="legend"><span><i class="dot" style="background:#55d6be"></i>Pass rate</span><span><i class="dot" style="background:#76a9ff"></i>Executable</span><span><i class="dot" style="background:#ffc857"></i>Claim support</span></div>
    <svg viewBox="0 0 760 300" role="img" aria-label="AVA quality history chart">
      <line x1="64" y1="246" x2="732" y2="246" stroke="#26324d"/><text x="54" y="250" fill="#9eabc7" text-anchor="end">0%</text><line x1="64" y1="191.5" x2="732" y2="191.5" stroke="#26324d"/><text x="54" y="195.5" fill="#9eabc7" text-anchor="end">25%</text><line x1="64" y1="137" x2="732" y2="137" stroke="#26324d"/><text x="54" y="141" fill="#9eabc7" text-anchor="end">50%</text><line x1="64" y1="82.5" x2="732" y2="82.5" stroke="#26324d"/><text x="54" y="86.5" fill="#9eabc7" text-anchor="end">75%</text><line x1="64" y1="28" x2="732" y2="28" stroke="#26324d"/><text x="54" y="32" fill="#9eabc7" text-anchor="end">100%</text>
      <text x="64" y="286" fill="#9eabc7" text-anchor="middle">2026-06-09</text><text x="732" y="286" fill="#9eabc7" text-anchor="middle">2026-06-11</text>
      <polyline fill="none" stroke="#55d6be" stroke-width="4" points="64,42.53333333333336 732,35.26666666666665"/><circle cx="64" cy="42.53333333333336" r="5" fill="#55d6be"><title>Pass rate: 93.3%</title></circle><circle cx="732" cy="35.26666666666665" r="5" fill="#55d6be"><title>Pass rate: 96.7%</title></circle><polyline fill="none" stroke="#76a9ff" stroke-width="4" points="64,42.60600000000002 732,35.19399999999999"/><circle cx="64" cy="42.60600000000002" r="5" fill="#76a9ff"><title>Executable: 93.3%</title></circle><circle cx="732" cy="35.19399999999999" r="5" fill="#76a9ff"><title>Executable: 96.7%</title></circle><polyline fill="none" stroke="#ffc857" stroke-width="4" points="64,61.78999999999999 732,57.21200000000002"/><circle cx="64" cy="61.78999999999999" r="5" fill="#ffc857"><title>Claim support: 84.5%</title></circle><circle cx="732" cy="57.21200000000002" r="5" fill="#ffc857"><title>Claim support: 86.6%</title></circle>
    </svg>
    <table>
      <thead><tr><th>Run</th><th>Passed</th><th>Executable</th><th>Claim support</th></tr></thead>
      <tbody><tr><td>ava-2026-06-09 (2026-06-09)</td><td>28/30</td><td>93.3%</td><td>84.5%</td></tr><tr><td>ava-2026-06-11 (2026-06-11)</td><td>29/30</td><td>96.7%</td><td>86.6%</td></tr></tbody>
    </table>
  </section>
</main></body></html>
